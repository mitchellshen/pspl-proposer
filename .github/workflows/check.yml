name: Check board.json

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the board
        run: python3 tools/check_board.py board.json
      - name: Check the page script
        run: node --check app.js
